<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>¡Feliz Cumpleaños!</title>
    <style>
        body {
            font-family: 'Arial', sans-serif;
            text-align: center;
            background-color: #f9f9f9;
            margin: 0;
            padding: 0;
        }
        h1 {
            color: #ff6f61;
            font-size: 3rem;
            margin-top: 50px;
        }
        p {
            color: #333;
            font-size: 1.5rem;
        }
        .cake {
            margin-top: 20px;
            width: 200px;
            height: auto;
        }
        .container {
            padding: 20px;
        }
        .message {
            background-color: #fff;
            padding: 20px;
            border-radius: 10px;
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.1);
            display: inline-block;
            margin-top: 20px;
        }
        .custom-image {
            margin-top: 20px;
            width: 300px; /* Ajusta el tamaño según necesites */
            height: auto;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>¡Feliz Cumpleaños Jhomi!</h1>
        <div class="message">
            <p>¡Que este año esté lleno de alegrías, amor y muchos exitos!</p>
            <p>Disfruta tu día al máximo. 🎉🎂</p>
        <!-- Tu imagen personalizada -->
        <img src="image.png" alt="Happie birthday princess!" class="custom-image">
    </div>
</body>
</html>
